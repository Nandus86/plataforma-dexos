<h2 mat-dialog-title>Alterar Senha</h2>

<mat-dialog-content>
    <div *ngIf="loading" class="loading-overlay">
        <mat-spinner diameter="40"></mat-spinner>
    </div>

    <form [formGroup]="form" class="form-container">
        <div class="form-grid" style="grid-template-columns: 1fr; gap: 16px; margin-top: 8px;">
            <mat-form-field appearance="outline">
                <mat-label>Senha Atual</mat-label>
                <input matInput [type]="hideOld ? 'password' : 'text'" formControlName="old_password">
                <button mat-icon-button matSuffix (click)="hideOld = !hideOld" type="button">
                    <mat-icon>{{ hideOld ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="form.get('old_password')?.hasError('required')">Senha atual é obrigatória</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Nova Senha</mat-label>
                <input matInput [type]="hideNew ? 'password' : 'text'" formControlName="new_password">
                <button mat-icon-button matSuffix (click)="hideNew = !hideNew" type="button">
                    <mat-icon>{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="form.get('new_password')?.hasError('required')">Nova senha é obrigatória</mat-error>
                <mat-error *ngIf="form.get('new_password')?.hasError('minlength')">Mínimo de 6 caracteres</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Confirmar Nova Senha</mat-label>
                <input matInput [type]="hideNew ? 'password' : 'text'" formControlName="confirm_password">
                <mat-error *ngIf="form.hasError('mismatch')">As senhas não coincidem</mat-error>
            </mat-form-field>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="close()" [disabled]="loading">Cancelar</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || loading" class="btn-gold">
        Alterar Senha
    </button>
</mat-dialog-actions>
